<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Minecraft schematic viewer blueprint icon">
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#143d77"/>
      <stop offset="0.55" stop-color="#0d2c58"/>
      <stop offset="1" stop-color="#081a33"/>
    </linearGradient>
    <pattern id="gridSmall" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#7dd3fc" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <pattern id="gridLarge" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbeafe" stroke-opacity="0.14" stroke-width="1.25"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b1220" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect width="128" height="128" rx="24" fill="url(#gridSmall)"/>
  <rect width="128" height="128" rx="24" fill="url(#gridLarge)"/>
  <rect x="10" y="10" width="108" height="108" rx="18" fill="none" stroke="#93c5fd" stroke-opacity="0.32" stroke-width="2"/>

  <g fill="none" stroke-linecap="round">
    <path d="M21 26H34" stroke="#f59e0b" stroke-width="3"/>
    <path d="M94 102H107" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 28L92 43L64 58L36 43Z" stroke="#f8fafc" stroke-width="4"/>
    <path d="M36 43V77L64 92V58" stroke="#f8fafc" stroke-width="4"/>
    <path d="M92 43V77L64 92" stroke="#f8fafc" stroke-width="4"/>
  </g>
</svg>
